name: smp
description: Fakepixel Survival SMP core
prefix: SMP
version: 2.5
main: club.abelix.games.fakevival.Game
api-version: '1.21'
load: POSTWORLD
softdepend: [stub-abelix-api]
authors: [1zg]
website: world.fakepixel.me
commands:
  smp:
    aliases: [fv, fakevival]
    description: Main SMP command
  cooking:
    aliases: [cook]
    description: Open SMP cooking help
    usage: /cooking help
  mayor:
    aliases: [election]
    description: View and participate in the SMP Mayor Election
    usage: /mayor
  alerts:
    aliases: [staffalerts]
    description: Toggle SMP staff alerts
  macrocheck:
    aliases: [mcheck]
    description: Run a non-punitive staff macro check
    usage: /macrocheck <player>
  smpmob:
    description: SMP optimized mob engine admin command
    usage: /smpmob <debug|count|profile|spawn|clear>
  smpworlds:
    aliases: [smpworld]
    description: Manage database-backed SMPWorlds runtime worlds
    usage: /smpworld <dbstatus|list|info|import|importfile|importslime|create|load|save|unload|clone|delete|goto>
  networkstatus:
    description: View SMP hub, overworld, and dungeon server status
    permission: fakevival.proxy.admin
  pregen:
    aliases: [pregenerate]
    description: Manage SMP chunk pregeneration
  language:
    aliases: [languages]
    description: Select your language
  lang:
    description: Select your language
  menu:
    aliases: [sbmenu, survivalmenu]
    description: Open the survival main menu
  mainmenu:
    description: Open the survival main menu
  playtimerewards:
    aliases: [ptr, rewards]
    description: Open monthly playtime rewards
  playtime:
    description: Open monthly playtime rewards
  fly:
    description: Toggle fly for yourself or another player
  speed:
    description: Set walk or fly speed
  gmc:
    description: Set creative mode
  gms:
    description: Set survival mode
  gmsp:
    description: Set spectator mode
  gma:
    description: Set adventure mode
  invsee:
    description: Open a player's inventory
  setspawn:
    description: Set server spawn
  spawn:
    description: Teleport to spawn
  warp:
    description: Travel between SMP hub, overworld, and dungeon lobby servers
    usage: /warp <hub|overworld|dungeon>
  setdungeonlobby:
    description: Set this dungeon server's lobby spawn
    permission: fakevival.dungeon.admin
  back:
    description: Teleport to your death or previous teleport location
  skills:
    description: View your skills
  playerlevel:
    aliases: [plevel, arank, adventurerank]
    description: View or upgrade your player level
  levels:
    description: View SMP player level progression
  stats:
    aliases: [playerstats]
    description: View your player stats
  jobs:
    description: View or select jobs
  npc:
    aliases: [fakevivalnpc]
    description: Create and manage Fakevival NPCs
  spawnprotection:
    aliases: [sprot]
    description: Set Fakevival spawn protection positions
  buildmode:
    aliases: [bm]
    description: Toggle admin build mode in spawn protection
  rtp:
    description: Randomly teleport to a safe location
  setrtplocation:
    description: Set this overworld server's RTP center
    permission: fakevival.rtp.admin
  sethome:
    description: Set a home
  home:
    description: Teleport to one of your homes
  delhome:
    aliases: [deletehome, removehome]
    description: Delete a home
  renamehome:
    description: Rename a home
  homes:
    description: List your homes
  tpa:
    description: Request to teleport to a player
  tpaccept:
    description: Accept a teleport request
  tpacancel:
    description: Cancel your outgoing teleport request
  tpahere:
    description: Request a player teleport to you
  tp:
    description: Admin teleport command
  tphere:
    description: Teleport a player to you
  tpall:
    description: Teleport all players
  vanish:
    aliases: [v]
    description: Toggle staff vanish
  zone:
    aliases: [zones, mapzone]
    description: Create safe, resource, and combat zones
  lootbox:
    aliases: [lootboxes]
    description: Give configurable weapon, gear, and item loot boxes
  dungeon:
    aliases: [dungeons]
    description: Join or manage dungeons
  createdungeon:
    description: Create a dungeon
  setdungeonportal:
    description: Set a dungeon portal location
  setmobspawnlocation:
    description: Set dungeon mob spawn locations
  addmobspawnlocation:
    description: Add another dungeon mob spawn location
  setbosslocation:
    description: Set dungeon boss location
  setdungeonarea:
    description: Set dungeon area pos1 and pos2
  setdungeonspawn:
    description: Set the dungeon arena spawn

  coins:
    aliases: [coin, balance, bal]
    description: View or manage Fakevival coins
  wipestats:
    description: Wipe a player's Fakevival stats without touching Abelix data
  battlepass:
    aliases: [bp]
    description: Open the BattlePass menu
  auctionhouse:
    aliases: [ah]
    description: Open the auction house menu
  bazaar:
    aliases: [bz, market]
    description: Open the Market menu
  quests:
    aliases: [quest, adventureguild, adventureguilds, ag, adventurer, guildadventure]
    description: Open Adventure Guild daily and weekly quests
  givedevnotebook:
    description: Give a personalized Developer's Notebook
    usage: /givedevnotebook <giver> <player>
  recipes:
    aliases: [recipebook, recipe]
    description: Open the Recipe Book
  etable:
    aliases: [enchanttable]
    description: Open the SMP enchant table
  enchants:
    aliases: [customenchants]
    description: View SMP custom enchants
  guilds:
    aliases: [guild]
    description: Open the guild and land claim menu
  store:
    aliases: [goldstore, shop]
    description: Open the SMP Gold Store
  enderchest:
    aliases: [ec, storage]
    description: Open personal Ender Chest storage pages
    permission: fakevival.command.storage
  sellall:
    aliases: [sellinventory, sellinv]
    description: Open the Sell All menu
  equipment:
    aliases: [equip]
    description: Open your equipment menu
  pve:
    aliases: [pvptoggle]
    description: Toggle PvE protection on or off
  boosters:
    aliases: [booster]
    description: View and activate your SMP boosters
  cosmetics:
    aliases: [cosmetic]
    description: Select your purchased cosmetics
  itembrowser:
    aliases: [customitems, cibrowser]
    description: Browse and give configured custom items
  edititem:
    aliases: [ei]
    description: Edit and persist SMP custom items
  maxiteminhand:
    aliases: [maxitem, maxhand]
    description: Max the held custom gear item's allowed stats and enchants
  addskill:
    description: Set a player's SMP skill level
  addjob:
    description: Set a player's SMP job level
  sandbox:
    aliases: [adminsandbox]
    description: Open the admin testing sandbox
  collections:
    aliases: [collection]
    description: View survival collections and unlocked custom recipes
  companions:
    aliases: [companion, pets, pet]
    description: View, summon, and upgrade companions
  kit:
    aliases: [kits]
    description: View and claim kits
  anvil:
    description: Open a virtual anvil
  rename:
    aliases: [itemname]
    description: Rename the held item
  hat:
    description: Wear the held block as a hat
  socialspy:
    aliases: [sspy]
    description: Toggle staff social spy
  econhistory:
    description: View a player's economy history
  tradehistory:
    description: View a player's trade history
  ahhistory:
    description: View a player's Auction House history
  itemhistory:
    description: View a player's item history
  rollbacktrade:
    description: Roll back a completed player trade
  freezeeco:
    description: Toggle a player's economy freeze
