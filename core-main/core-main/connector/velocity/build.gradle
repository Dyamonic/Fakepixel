plugins {
    id "io.sentry.jvm.gradle" version "5.12.2"
}

def log4jVersion = "2.24.3"

sentry {
    includeSourceContext = false
    includeDependenciesReport = false

    org = "abelix"
    projectName = "velocity"
    authToken = System.getenv("SENTRY_AUTH_TOKEN")

    autoInstallation {
        enabled = true
    }
}

enablePublishing(project)

dependencies {
    compileOnly(libs.velocity.api)
    compileOnly(libs.velocity.proxy)
    compileOnly(libs.sonar)
    compileOnly(libs.vpacketevents)

    compileOnly("org.apache.logging.log4j:log4j-api:${log4jVersion}")
    compileOnly("org.apache.logging.log4j:log4j-core:${log4jVersion}")
    compileOnly("org.apache.logging.log4j:log4j-jul:${log4jVersion}")
    compileOnly("org.apache.logging.log4j:log4j-slf4j2-impl:${log4jVersion}")
    compileOnly("org.apache.logging.log4j:log4j-iostreams:${log4jVersion}")

    implementation(libs.abelix.di.api)
    implementation(libs.abelix.di.core)
    implementation(project(":network"))
    implementation(libs.gson)
}

shadowJar {
    archiveFileName.set('CoreVelocityConnector.jar')
    destinationDirectory.set(file("$rootDir/artifacts"))
}

tasks.named('processResources') {
    filesMatching('velocity-plugin.json') {
        expand([
                VERSION    : project.version,
        ])
        filteringCharset = 'UTF-8'
    }
}
