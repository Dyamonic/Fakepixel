image: registry.fakepixel.online/fakepixel-minecraft/kubernetes/images/base:main

stages:
  - build
  - upload
  - release

cache:
  paths:
    - .gradle/wrapper
    - .gradle/caches

build:
  stage: build
  variables:
    GIT_DEPTH: 0
  before_script:
    - GRADLE_USER_HOME="$(pwd)/.gradle"
    - export GRADLE_USER_HOME
    - git checkout -B "$CI_COMMIT_REF_NAME" "$CI_COMMIT_SHA"
  script:
    - chmod +x ./gradlew
    - ./gradlew clean build --no-daemon --stacktrace --build-cache --parallel
  artifacts:
    paths:
      - ./artifacts/*
    expire_in: 2 days
  rules:
    - if: $CI_COMMIT_MESSAGE !~ /--no-build/
      when: always

s3:
  stage: upload
  dependencies:
    - build
  script:
    - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
    - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
    - aws configure set region $AWS_REGION
    - aws s3 cp --endpoint-url=$AWS_ENDPOINT_URL artifacts/Api.jar s3://$AWS_BUCKET/mono/plugin/api/$CI_COMMIT_REF_NAME/
  rules:
    - if: $CI_COMMIT_MESSAGE !~ /--no-s3-upload/
      when: always

gitlab_release:
  stage: release
  image: "://gitlab.com"
  needs:
    - build
    - s3
  script:
    - |
      RAW_REF="$CI_COMMIT_REF_NAME"
      VERSION="${RAW_REF#release/}" 
      TAG="v${VERSION}"
      echo "Creating GitLab Release for tag ${TAG}"
      release-cli create \
        --tag-name "${TAG}" \
        --ref "${CI_COMMIT_SHA}" \
        --name "Release ${TAG}" \
        --description "Automatic release for branch ${CI_COMMIT_REF_NAME}. Commit: ${CI_COMMIT_SHORT_SHA}"
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH =~ /^release\/.*$/ && $CI_COMMIT_MESSAGE !~ /--no-release/'
      when: on_success
    - when: never
