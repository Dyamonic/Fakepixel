abelix:
  enabled: true
  use-rank-prefix: true
  use-rank-priority: true
  use-gold: true
  gamer-classes:
  - club.abelix.api.base.gamer.Gamer
  - club.abelix.api.gamer.Gamer
  - me.abelix.api.base.gamer.Gamer
  - net.fakepixel.api.base.gamer.Gamer
  prefix-placeholders:
  - '%abelix_prefix%'
  gold-placeholders:
  - '%abelix_gold%'
  - '%abelixapi_gold%'
rank-detection:
  enabled: true
  refresh-ticks: 200
  rank-placeholders:
  - '%abelix_rank%'
  - '%abelix_group%'
  - '%fakepixel_rank%'
  - '%fakepixel_group%'
