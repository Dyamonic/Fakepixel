  tiered:
    events:
      enabled: true
      name: Events
      category: TIERED
      description: See major-event starts.
      required-system: EVENTS
      statistic: events_seen
      thresholds: [3, 10, 25, 100, 500]
      points: [5, 10, 15, 20, 25]
    gold:
      enabled: true
      name: Gold
      category: TIERED
      description: Earn Pit Gold from legitimate gameplay.
      required-system: PIT_GOLD
      statistic: gold_earned
      thresholds: [10000, 100000, 1000000, 10000000, 30000000]
      points: [5, 10, 15, 20, 25]
    renown:
      enabled: true
      name: Renown
      category: TIERED
      description: Earn Renown legitimately.
      required-system: RENOWN
      statistic: lifetime_renown_earned
      thresholds: [10, 50, 200, 500, 2000]
      points: [5, 10, 15, 20, 25]
    contracts:
      enabled: true
      name: Contracts
      category: TIERED
      description: Complete contracts.
      required-system: CONTRACTS
      statistic: contracts_completed
      thresholds: [5, 25, 100, 250, 500]
      points: [5, 10, 15, 20, 25]
