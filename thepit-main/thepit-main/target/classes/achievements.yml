achievements:
  enabled: true
  title: '&8The Pit Achievements'
  size: 54
  save-interval-seconds: 10
  notification:
    title: '&e&lACHIEVEMENT UNLOCKED!'
    subtitle: '&a%achievement_name% &7+%points% Points'
    chat: '&e&lACHIEVEMENT! &7You completed &a%achievement_name% &7and earned &e%points% Achievement Points&7!'
    sound: LEVEL_UP
    delay-ticks: 70
    spacing-ticks: 55
  broadcasts:
    enabled: true
    achievements:
    - the-xx
    - big-time
    maximum-tiered: true
    format: '&e&lACHIEVEMENT! &r%abelix_prefix%%player% &7completed &a%achievement_name%&7!'
  migration:
    evaluate-existing-lifetime-stats: true
    send-notifications: false
  seasonal:
    timezone: America/Los_Angeles
    easter:
      enabled: true
      start: '03-15'
      end: '04-30'
    summer:
      enabled: true
      start: '06-01'
      end: '08-31'
  menu:
    filler:
      material: STAINED_GLASS_PANE
      data: 15
      name: ' '
    close-slot: 49
    categories:
      tiered: { slot: 10, material: NETHER_STAR, name: '&eTiered Achievements' }
      combat: { slot: 12, material: DIAMOND_SWORD, name: '&cCombat' }
      progression: { slot: 14, material: EXP_BOTTLE, name: '&bProgression' }
      economy: { slot: 16, material: GOLD_INGOT, name: '&6Economy' }
      events: { slot: 28, material: FIREWORK, name: '&dEvents' }
      mystic: { slot: 30, material: ENCHANTMENT_TABLE, name: '&5Mystic' }
      fishing: { slot: 32, material: FISHING_ROD, name: '&3Fishing' }
      miscellaneous: { slot: 34, material: PAPER, name: '&fMiscellaneous' }
      seasonal: { slot: 40, material: DOUBLE_PLANT, name: '&aSeasonal' }
  systems:
    CORE: true
    COMBAT: true
    LEVELS: true
    PRESTIGE: true
    PIT_GOLD: true
    RENOWN: true
    BOUNTIES: true
    STREAKS: true
