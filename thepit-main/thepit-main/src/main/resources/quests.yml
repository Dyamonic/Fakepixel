      slot: 14
      display-name: '&6Weekly Double Up'
      material: PAPER
      storage-id: double-up
      type: gold-earned
      target: 10000
      description: 'Earn 10,000 Pit Gold from legitimate gameplay.'
      rewards:
        pit-gold: 10000
        network-experience: 7000
        event-experience: 7700
        event-experience-enabled: false
      lore:
      - '&7Earn &610,000 Pit Gold &7from'
      - '&7legitimate gameplay.'
      - ''
      - '&7Progress: &e%progress%&7/&e%target%'
      - '&7Reward: &610,000 Gold'
      - '&7Network Experience: &b7,000'
      - ''
      - '%state_line%'

  states:
    available: '&eClick to start!'
    active: '&aYou''ve already started this quest!'
    completed: '&aQuest completed!'

  rewards:
    network-experience-command: ''
    event-experience-command: ''

  sounds:
    start:
      enabled: true
      name: CLICK
      volume: 1.0
      pitch: 1.0
    complete:
      enabled: true
      name: LEVEL_UP
      volume: 1.0
      pitch: 1.0
    toggle:
      enabled: true
      name: CLICK
      volume: 1.0
      pitch: 1.2

  messages:
    profile-loading: '&cYour profile is still loading.'
    started: '&aQuest started!'
    already-active: '&aYou''ve already started this quest!'
    already-completed: '&aQuest completed!'
    completed: '&a&lQUEST COMPLETE! &7You completed &f%quest%&7 and earned &6%gold% Gold&7.'
    auto-accept-locked: '&cAuto-Accept Quests requires MVP+ or higher.'
