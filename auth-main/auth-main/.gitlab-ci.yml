image: container-registry.oracle.com/graalvm/jdk:21

stages:
  - build
  - upload

cache:
  paths:
    - .gradle/wrapper
    - .gradle/caches
    - .docker/cache

build:
  stage: build
  before_script:
    - GRADLE_USER_HOME="$(pwd)/.gradle"
    - export GRADLE_USER_HOME
  script:
    - chmod +x ./gradlew
    - ./gradlew clean build --no-daemon --stacktrace --build-cache --parallel
  artifacts:
    paths:
      - ./artifacts/*
    expire_in: 2 days
  rules:
    - if: $CI_COMMIT_MESSAGE !~ /--no-build/
      when: always

s3:
  stage: upload
  dependencies:
    - build
  image:
    name: registry.abelix.club/abelix-minecraft/kubernetes/images/base:main
    entrypoint: [ "" ]
  script:
    - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
    - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
    - aws configure set region $AWS_REGION
    - aws s3 cp --endpoint-url=$AWS_ENDPOINT_URL artifacts/Auth.jar s3://$AWS_BUCKET/mono/plugin/authorization/$CI_COMMIT_REF_NAME/
  rules:
    - if: $CI_COMMIT_MESSAGE !~ /--no-s3-upload/
      when: always

      