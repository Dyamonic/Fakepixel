plugins {
    id 'java-library'
    id 'com.gradleup.shadow' version '9.1.0'
}

group = 'club.abelix.games'
version = '1.0.0-PROD'

repositories {
    mavenCentral()
    mavenLocal()

    maven { url = "https://repo.abelix.club/repository/public/" }

    maven {
        url "https://git.fakepixel.online/api/v4/groups/6/-/packages/maven"

        credentials(HttpHeaderCredentials) {
            name = "${System.getenv("CI_JOB_TOKEN") ? 'Job-Token' : 'Private-Token'}"
            value = System.getenv("CI_JOB_TOKEN") ?: System.getenv("ABELIX_ACCESS_TOKEN")
        }

        authentication { header(HttpHeaderAuthentication) }
    }
}

dependencies {
    compileOnly(libs.jetbrains.annotations)

    compileOnly(libs.lombok)
    annotationProcessor(libs.lombok)

    compileOnly(libs.spigot)
    compileOnly(libs.protocollib)

    compileOnly(libs.abelix.api)
    compileOnly(libs.abelix.core.connector)
    compileOnly(libs.abelix.di.api)
    compileOnly(libs.abelix.di.bukkit)
    compileOnly(libs.abelix.gamecosmetics)
}

tasks.assemble.dependsOn(shadowJar)

shadowJar {
    archiveFileName.set('BuildFFAGamePlugin.jar')
    destinationDirectory.set(file("$rootDir/artifacts"))
}

tasks.named('processResources') {
    inputs.property 'VERSION', project.version
    inputs.property 'COMMIT', System.getenv('CI_COMMIT_SHORT_SHA') ?: 'unspecified'

    filesMatching('plugin.yml') {
        expand([
                VERSION    : project.version,
                DESCRIPTION: project.description ?: '',
                URL        : project.findProperty('url') ?: '',
                COMMIT     : System.getenv('CI_COMMIT_SHORT_SHA') ?: 'unspecified'
        ])
        filteringCharset = 'UTF-8'
    }
}
